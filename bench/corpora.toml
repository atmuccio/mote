# Speed benchmark corpora: public repositories pinned to exact commits.
#
# Used by scripts/bench.sh and scripts/bench.ps1 (see docs/benchmark.md). Each corpus is fetched
# with `git init` + `git fetch --depth 1 origin <rev>` into bench/.corpora/<name>, then scanned
# straight from the object database (`mote scan --rev <rev>`) and, when checked out, as a
# working tree.
#
# Format: only [[corpus]] tables whose values are one-line strings. The scripts parse this file
# without a TOML library, so keep it that simple. To move a pin, take the new commit from
# `git ls-remote <url> HEAD` and update the numbers in docs/benchmark.md in the same change.

