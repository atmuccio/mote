name: Bug report
description: A crash, a wrong result, a configuration or CI problem, or a slow scan (for rule findings, use "False positive or missed problem").
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For a security vulnerability, don't open an issue: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Mote version
      description: The output of `mote version`.
      placeholder: mote 0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Command line
        - GitHub Action
        - Another CI system
        - MCP server
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what went wrong.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command line and its output (add `-v` for more detail, `--timings` for a slow scan). For the GitHub Action, the workflow step and the job log.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce (optional)
      description: A public repository and commit, or the smallest set of files that shows the problem.
  - type: textarea
    id: config
    attributes:
      label: Configuration (optional)
      description: Your `.mote.yaml`, or the relevant part of it.
      render: yaml
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I tried the latest release.
          required: false
