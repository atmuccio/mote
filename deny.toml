# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/). CI: `cargo deny check`.

[graph]
all-features = true

[advisories]
# RustSec advisories: vulnerabilities always fail; unmaintained/unsound are reported for all crates.
ignore = []

[licenses]
# Allowlist only. Permissive licenses plus MPL-2.0 (file-level copyleft; fine for a statically
# linked dependency we don't modify). Everything NOT listed is denied, which covers:
#   * copyleft: GPL-*, LGPL-*, AGPL-*, EUPL-*, OSL-*, CDDL-*, EPL-* (Checkstyle/SpotBugs-style code
#     must never enter the dependency graph — see docs/architecture.md §1);
#   * source-available / non-OSI: BUSL-1.1, SSPL-1.0, Elastic-2.0, Commons Clause, PolyForm-*,
#     and anything with a custom or unknown license.
# cargo-deny's version-2 license config has no explicit deny list; the allowlist is the policy.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.9
# The allowlist is policy, not inventory: don't warn about allowed licenses no dependency uses yet.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Workspace crates are checked like any other (they are MIT OR Apache-2.0).
ignore = false

[bans]
multiple-versions = "warn"
# Workspace crates depend on each other by path, which cargo-deny counts as wildcards unless the
# crates are marked publish = false. Tighten to "deny" (with allow-wildcard-paths = true) once they are.
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
